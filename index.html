<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick EN → AR Translator</title>

<style>
:root{
  --bg:#000;
  --card:#121212;
  --text:#fff;
  --line:#2a2a2a;
  --btn:#1e90ff;
  --r:14px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Segoe UI,Tahoma,Arial,sans-serif;
  padding:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:16px;
}

textarea{
  width:100%;
  min-height:120px;
  background:#000;
  color:#fff;
  border:1px solid var(--line);
  padding:10px;
  border-radius:10px;
}

button{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#1c1c1c;
  color:#fff;
  cursor:pointer;
}

button.primary{
  background:var(--btn);
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English → Arabic Translator 🌍</h2>

<div class="card">
  <textarea id="text" placeholder="Type English word here..."></textarea>
  <br><br>
  <button class="primary" onclick="translate()">Translate</button>
</div>

<div class="card">
  <textarea id="result" readonly placeholder="Arabic translation will appear here..."></textarea>
</div>

<script>
async function translate(){
  const text = document.getElementById("text").value.trim();
  if(!text) return;

  const url =
    "https://api.mymemory.translated.net/get?q=" +
    encodeURIComponent(text) +
    "&langpair=en|ar";

  try{
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById("result").value =
      data.responseData.translatedText;
  }catch{
    document.getElementById("result").value = "Translation error ❌";
  }
}
</script>

</body>
</html>
